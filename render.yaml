# Blueprint Render : application + base PostgreSQL gérée, région Francfort (la plus proche de Dakar).
# Render > New > Blueprint > choisir ce dépôt. Les valeurs « sync: false » sont demandées à l'import.
databases:
  - name: btp-db
    databaseName: btp
    user: btp
    region: frankfurt
    plan: basic-256mb        # l'offre gratuite de Render expire : ne pas l'utiliser en production

services:
  - type: web
    name: btp-manager
    runtime: docker
    region: frankfurt
    plan: starter            # l'offre gratuite se met en veille : retours Wave et premières visites très lents
    healthCheckPath: /sante
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: btp-db
          property: connectionString   # connexion interne (réseau privé Render)
      - key: COOKIE_SECURE
        value: "1"
      - key: NOM_PRODUIT
        value: BTP Manager 360
      - key: INSCRIPTION_OUVERTE
        value: "1"
      - key: ESSAI_HEURES
        value: "24"
      - key: ABONNEMENT_PRIX_MENSUEL_XOF
        value: "15000"
      - key: APP_URL                 # adresse publique : liens des e-mails et retour de Wave
        value: https://www.bati.com
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_EXPEDITEUR        # doit être validé dans Brevo (domaine bati.com authentifié)
        value: no-reply@bati.com
      - key: EMAIL_EXPEDITEUR_NOM
        value: BTP Manager 360
